[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-cli"
version = "0.1.0"
description = "Automated red teaming for AI systems"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
probe = "run:cli"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["engine*", "models*"]
